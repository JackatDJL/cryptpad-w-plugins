name: Build image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint-wrapper.sh
      - versions.json
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cryptpad: ${{ steps.versions.outputs.cpad_tag }}
      sso: ${{ steps.versions.outputs.sso_version }}
      monitoring: ${{ steps.versions.outputs.mon_version }}
      monitoring_ref: ${{ steps.versions.outputs.mon_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read pinned versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          cpad_tag=$(jq -er '.cryptpad' versions.json)
          case "$cpad_tag" in version-*) cpad_version=${cpad_tag#version-} ;; *) echo 'cryptpad must be a Docker Hub version-* tag' >&2; exit 1 ;; esac
          echo "cpad_tag=$cpad_tag" >> "$GITHUB_OUTPUT"
          echo "cpad_version=$cpad_version" >> "$GITHUB_OUTPUT"
          echo "sso_version=$(jq -er '.sso' versions.json)" >> "$GITHUB_OUTPUT"
          echo "mon_version=$(jq -er '.monitoring' versions.json)" >> "$GITHUB_OUTPUT"
          mon_ref=$(jq -er '.monitoring_ref' versions.json)
          echo "mon_ref=$mon_ref" >> "$GITHUB_OUTPUT"
          echo "mon_ref_short=${mon_ref:0:7}" >> "$GITHUB_OUTPUT"
          image=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.versions.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=cpad-${{ steps.versions.outputs.cpad_version }}
            type=raw,value=cpad-${{ steps.versions.outputs.cpad_version }}-sso-${{ steps.versions.outputs.sso_version }}-mon-${{ steps.versions.outputs.mon_version }}-ref-${{ steps.versions.outputs.mon_ref_short }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            CPAD_VERSION=${{ steps.versions.outputs.cpad_tag }}
            SSO_VERSION=${{ steps.versions.outputs.sso_version }}
            MON_VERSION=${{ steps.versions.outputs.mon_version }}
            MON_REF=${{ steps.versions.outputs.mon_ref }}
          cache-from: type=registry,ref=${{ steps.versions.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.versions.outputs.image }}:buildcache,mode=max
